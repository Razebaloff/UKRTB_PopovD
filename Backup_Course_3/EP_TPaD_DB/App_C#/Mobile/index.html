<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#93bfd7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Территория хоккея</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#174d80;background:#95bfd5;--ice:#e4f5ff;--ink:#194e7a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#95bfd5}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid #ffffff;outline-offset:3px}
#app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(150deg,#beddec,#74a7c6 50%,#b6d9e9)}
#pan{width:100%;height:100%;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;scroll-behavior:smooth}
#pan::-webkit-scrollbar{display:none}
#box{position:relative;flex:none;margin:auto;overflow:hidden;box-shadow:0 0 0 1px #3b6b8740}
#stage{width:1920px;height:1080px;position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;isolation:isolate}
#artwork{position:absolute;inset:0;display:block;width:1920px;height:1080px;pointer-events:none;user-select:none;-webkit-user-drag:none}
#fallback{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#d2e9f2,#7eb3d2);z-index:-1}
#fallback:before{content:'ТЕРРИТОРИЯ ХОККЕЯ';position:absolute;top:260px;left:0;width:100%;text-align:center;font-size:52px;font-weight:800;letter-spacing:2px;color:#194e7a}
.hotspot{position:absolute;display:grid;place-items:center;padding:0;appearance:none;background:transparent;border:0;color:transparent;outline-offset:5px;z-index:3}
.hotspot.round{border-radius:50%}.hotspot.pill{border-radius:999px}
/* Десктопная фактура и надписи принадлежат оригинальному изображению.
   Анимируем лишь узкий ледяной обод, не перекрывающий текст. */
.hotspot.round::after,.hotspot.pill::after{content:'';position:absolute;inset:3px;pointer-events:none;opacity:0;border-radius:inherit;border:5px solid #e8fbff;box-shadow:inset 0 0 13px 2px #e4faff85,0 0 15px #c1edff70;animation:synced-frost 6.6s ease-in-out infinite}
.hotspot:hover::after,.hotspot:focus-visible::after,.hotspot:active::after{opacity:.96!important;animation:none;border-width:8px;box-shadow:inset 0 0 32px 5px #e3f9ff9c,0 0 24px #e2f9ff}
.hotspot:active{transform:scale(.985)}
@keyframes synced-frost{0%,100%{opacity:0}32%,49%{opacity:.75}80%{opacity:0}}
.controls[hidden],#successFX[hidden]{display:none!important}
.controls{position:absolute;inset:0;pointer-events:none;z-index:5}
.controls>*{pointer-events:auto}
.controls .hotspot{z-index:4}
.input{position:absolute;background:transparent;color:#17456a;border:0;border-radius:999px;padding:2px 22px;outline:none;font-size:25px;font-weight:600;text-align:center;line-height:1;min-width:0;caret-color:#1a5e90}
.input::placeholder{color:transparent}
.input:focus,.input:not(:placeholder-shown){background:#f1f7fa;color:#17456a;box-shadow:inset 0 0 5px #acc8d7}
.input:focus-visible{outline:3px solid #d7f1ff;outline-offset:-3px}
.remember{position:absolute;display:flex;align-items:center;justify-content:flex-start;cursor:pointer}
.remember input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%}
.remember .mark{display:block;position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:27px;color:#176396;opacity:0}
.remember:has(input:checked) .mark{opacity:1}
#stageStatus{position:absolute;left:660px;top:734px;width:600px;text-align:center;font-size:19px;font-weight:700;color:#fbdaaf;text-shadow:0 1px 5px #182e50}
#stageStatus:empty{display:none}
#successFX{pointer-events:none;position:absolute;inset:0;z-index:10}
#successName{position:absolute;left:540px;top:550px;width:840px;text-align:center;font-size:54px;font-weight:900;letter-spacing:1.4px;color:white;text-shadow:0 0 8px white,0 0 34px #f8ffff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:imprint 2.35s ease-in-out both}
@keyframes imprint{0%{opacity:0;transform:translate3d(0,-135px,0) scale(.45)}20%{opacity:1;transform:translate3d(0,-130px,0) scale(.6)}48%{transform:translate3d(0,-110px,0) scale(1.14)}74%{transform:translate3d(0,-15px,0) scale(1.13)}82%{transform:translate3d(0,12px,0) scale(1.08,.89)}100%{opacity:1;transform:translateZ(0) scale(1);text-shadow:0 0 3px #f4ffff}}
#snowFX{position:absolute;inset:0;z-index:8;overflow:hidden;pointer-events:none}
#snowFX i{position:absolute;left:var(--x);top:var(--y);width:var(--r);height:var(--r);background:#f4fcff;border-radius:50%;box-shadow:0 0 5px #f0faff;opacity:var(--o);animation:gust var(--d) cubic-bezier(.24,.43,.73,.94) both;animation-delay:var(--delay)}
@keyframes gust{to{transform:translate3d(var(--vx),var(--vy),0);opacity:0}}
#assist{position:absolute;z-index:30;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:9px;pointer-events:none}
#assist button,#assist .hint{pointer-events:auto;border:1px solid #d9f2ffce;border-radius:999px;min-height:43px;padding:8px 13px;background:#123e64da;color:#f1faff;font-size:13px;font-weight:700;box-shadow:0 3px 16px #1d416d70;backdrop-filter:blur(6px)}
#assist button:active{background:#226c9c}
#assist .hint{display:flex;align-items:center;pointer-events:none;min-width:0}
#rotate{display:none}
#alert{position:absolute;z-index:35;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(88%,520px);min-height:48px;border-radius:16px;background:#113d60f2;color:white;padding:12px 18px;text-align:center;font-size:14px;font-weight:700;box-shadow:0 8px 22px #14304599;pointer-events:none}
#alert[hidden]{display:none}
#sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(orientation:landscape){#assist{bottom:max(7px,env(safe-area-inset-bottom))}#assist .hint{display:none}#assist button{min-height:34px;padding:4px 10px;opacity:.75}}
@media(orientation:portrait){#rotate{display:inline-flex}#assist .hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#snowFX{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="pan" aria-label="Хоккейная арена. Проведите пальцем влево или вправо для просмотра всей сцены.">
  <div id="box">
   <div id="stage">
    <div id="fallback"></div>
    <img id="artwork" alt="" draggable="false">
    <div id="snowFX" aria-hidden="true"></div>
    <section id="entry" class="controls" aria-label="Главный экран">
     <button class="hotspot round" style="left:360px;top:310px;width:346px;height:348px" data-go="login" aria-label="Войти"></button>
     <button class="hotspot round" style="left:1214px;top:311px;width:346px;height:348px" data-go="register" aria-label="Зарегистрироваться"></button>
     <button class="hotspot round" style="left:786px;top:585px;width:347px;height:348px" data-go="menu-schedule" aria-label="Расписание"></button>
    </section>
    <section id="menu" class="controls" aria-label="Главное меню" hidden>
     <button class="hotspot pill" style="left:160px;top:315px;width:187px;height:59px" data-go="entry" aria-label="Назад"></button>
     <button class="hotspot round" style="left:352px;top:228px;width:255px;height:257px" data-action="rent" aria-label="Заказать аренду"></button>
     <button class="hotspot round" style="left:352px;top:592px;width:255px;height:257px" data-action="profile" aria-label="Профиль"></button>
     <button class="hotspot round" style="left:1314px;top:228px;width:255px;height:257px" data-action="info" aria-label="Информация"></button>
     <button class="hotspot round" style="left:1314px;top:592px;width:255px;height:257px" data-action="schedule" aria-label="Расписание занятий"></button>
    </section>
    <section id="login" class="controls" aria-label="Вход" hidden>
     <button class="hotspot pill" style="left:160px;top:316px;width:187px;height:59px" data-go="entry" aria-label="Назад"></button>
     <form id="loginForm" autocomplete="on" novalidate>
      <input class="input" style="left:705px;top:466px;width:512px;height:66px" name="login" aria-label="Логин" placeholder=" " maxlength="64" autocomplete="username" required>
      <input class="input" style="left:705px;top:560px;width:512px;height:66px" name="password" type="password" aria-label="Пароль" placeholder=" " maxlength="128" autocomplete="current-password" required>
      <input class="input" style="left:705px;top:654px;width:512px;height:66px;display:none" name="code" aria-label="Код из электронной почты" inputmode="text" autocomplete="one-time-code" placeholder=" ">
      <label class="remember" style="left:745px;top:728px;width:435px;height:43px" aria-label="Запомнить меня"><input name="remember" type="checkbox"><span class="mark">✓</span></label>
      <button class="hotspot pill" style="left:744px;top:804px;width:430px;height:68px" type="submit" aria-label="Прислать код на электронную почту" id="submit"></button>
      <div id="stageStatus" role="status" aria-live="polite"></div>
     </form>
    </section>
    <section id="register" class="controls" aria-label="Регистрация" hidden>
     <button class="hotspot pill" style="left:160px;top:316px;width:187px;height:59px" data-go="entry" aria-label="Назад"></button>
     <form id="registerForm" novalidate>
      <input class="input" style="left:705px;top:445px;width:512px;height:66px" name="login" aria-label="Логин" placeholder=" " maxlength="64" autocomplete="username" required>
      <input class="input" style="left:705px;top:548px;width:512px;height:66px" name="password" type="password" aria-label="Пароль" placeholder=" " maxlength="128" autocomplete="new-password" required>
      <input class="input" style="left:705px;top:650px;width:512px;height:66px" name="email" type="email" aria-label="Адрес электронной почты" placeholder=" " autocomplete="email" required>
      <button class="hotspot pill" style="left:744px;top:762px;width:430px;height:68px" type="submit" aria-label="Зарегистрироваться"></button>
     </form>
    </section>
    <div id="successFX" hidden aria-hidden="true"><span id="successName"></span></div>
   </div>
  </div>
 </div>
 <div id="assist" aria-label="Управление обзором">
  <button id="panLeft" type="button" aria-label="Сдвинуть вид влево">◀</button>
  <span class="hint">Проведите вбок, чтобы увидеть всю арену</span>
  <button id="panRight" type="button" aria-label="Сдвинуть вид вправо">▶</button>
  <button id="fit" type="button" aria-label="Уместить всю арену">Обзор</button>
  <button id="rotate" type="button" aria-label="Переключить масштаб">Масштаб</button>
 </div>
 <div id="alert" role="status" aria-live="polite" hidden></div>
 <div id="sr" role="status" aria-live="polite"></div>
</div>
<script>
(()=>{'use strict';
// Original desktop screenshots, not approximated or redrawn artwork.
const base='https://raw.githubusercontent.com/Razebaloff/UKRTB_PopovD/main/COURSE_3/EP_TPaD_DB/App_C%23/';
const images={entry:base+'Entry_Preview.jpg',menu:base+'Menu_Preview.jpg',login:base+'Login_Preview.png',loginCode:base+'Login_Code_Preview.png',register:base+'Registration_Preview.png'};
const $=selector=>document.querySelector(selector);
const stage=$('#stage'),box=$('#box'),pan=$('#pan'),artwork=$('#artwork'),alert=$('#alert');
const sections=['entry','login','register','menu'];
let page='entry',codeRequested=false,username='',magnified=true,successTimeout=0,noticeTimeout=0,loadSequence=0;
const memoryKey='territory-hockey-mobile-user';
let reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
const size={w:1920,h:1080};
function layout(focus){
 const w=pan.clientWidth,h=pan.clientHeight,fit=Math.min(w/size.w,h/size.h);
 // In portrait mode the stage can be panned horizontally; no button becomes tiny.
 const s=(!magnified||w>=h)?fit:Math.max(fit,Math.min(.90,h/size.h*.92));
 const prior=(pan.scrollLeft+pan.clientWidth/2)/(box.clientWidth||1);
 box.style.width=Math.round(s*size.w)+'px';box.style.height=Math.round(s*size.h)+'px';
 stage.style.transform='scale('+s+')';
 requestAnimationFrame(()=>{
  let x=focus===undefined?Math.max(0,(prior*box.clientWidth-w/2)):focus*s-w/2;
  if(w>=h||!magnified)x=0;
  pan.scrollLeft=Math.max(0,Math.min(box.clientWidth-w,x));
 });
}
function panTo(x){const scale=box.clientWidth/size.w;pan.scrollTo({left:Math.max(0,x*scale-pan.clientWidth/2),behavior:reduceMotion?'instant':'smooth'});}
function activate(id){sections.forEach(name=>$('#'+name).hidden=name!==id)}
function imageFor(id){return id==='login'&&codeRequested?'loginCode':id}
function updateImage(){
 const asset=imageFor(page),src=images[asset],token=++loadSequence;
 artwork.style.opacity='1';artwork.src=src;
 artwork.onerror=()=>{if(token===loadSequence)notice('Для оригинальной графики требуется интернет при первом открытии.',4500)};
}
function show(id,focus){
 if(!sections.includes(id))return;
 clearTimeout(successTimeout);$('#successFX').hidden=true;page=id;activate(id);updateImage();
 $('#sr').textContent=({entry:'Главный экран',login:'Вход',register:'Регистрация',menu:'Главное меню'})[id];
 requestAnimationFrame(()=>layout(focus??(id==='entry'?530:960)));
}
function notice(text,ms=2700){alert.textContent=text;alert.hidden=false;clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>alert.hidden=true,ms)}
function resetCode(){codeRequested=false;const code=$('#loginForm [name=code]');code.style.display='none';code.required=false;code.value='';$('#submit').setAttribute('aria-label','Прислать код на электронную почту');$('#stageStatus').textContent='';if(page==='login')updateImage()}
const login=$('#loginForm');
for(const name of ['login','password'])login.elements[name].addEventListener('input',()=>{if(codeRequested)resetCode()});
try{let data=JSON.parse(localStorage.getItem(memoryKey)||'null');if(typeof data?.user==='string'&&data.remember){login.elements.login.value=data.user;login.elements.remember.checked=true}}catch(_){/* blocked on some file:// browsers */}
login.addEventListener('submit',e=>{
 e.preventDefault();const user=login.elements.login.value.trim(),pass=login.elements.password.value;
 if(!user||!pass){notice('Введите логин и пароль');return}
 if(!codeRequested){codeRequested=true;const code=login.elements.code;code.style.display='';code.required=true;$('#submit').setAttribute('aria-label','Войти');$('#stageStatus').textContent='Демо-режим: введите любой непустой код';updateImage();panTo(960);return}
 if(!login.elements.code.value.trim()){notice('Введите код');return}
 username=user;
 try{if(login.elements.remember.checked)localStorage.setItem(memoryKey,JSON.stringify({user,remember:true}));else localStorage.removeItem(memoryKey)}catch(_){}
 $('#stageStatus').textContent='';$('#successName').textContent=username;$('#successFX').hidden=false;
 if(!reduceMotion)makeGust();
 successTimeout=setTimeout(()=>{resetCode();show('menu',960)},reduceMotion?350:2580);
});
$('#registerForm').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;if(!form.elements.login.value.trim()||!form.elements.password.value||!form.elements.email.value.trim()){notice('Заполните все поля');return}if(!form.elements.email.checkValidity()){notice('Проверьте электронную почту');return}notice('Регистрация пока демонстрационная, данные не отправлены.',3900)});
function makeGust(){const root=$('#snowFX');root.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<40;i++){
 const snow=document.createElement('i'),left=i%2===0,t=i/40;
 snow.style.setProperty('--x',(left?0:1800)+(i%8)*13+'px');snow.style.setProperty('--y',(i%11)*13+'px');snow.style.setProperty('--r',(1.5+(i%5)*.8)+'px');snow.style.setProperty('--o',(.32+(i%7)*.07).toFixed(2));snow.style.setProperty('--vx',(left?1500:-1500)+'px');snow.style.setProperty('--vy',(830+(i%7)*42)+'px');snow.style.setProperty('--d',(1.4+(i%5)*.17)+'s');snow.style.setProperty('--delay',(t*.2)+'s');frag.append(snow);
 }root.append(frag)}
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 const go=button.dataset.go;
 if(go==='menu-schedule'){show('menu',1450);notice('Откройте «РАСПИСАНИЕ ЗАНЯТИЙ»');return}
 if(go){show(go);return}
 if(button.dataset.action){
  const name=({rent:'Аренда',profile:'Профиль',info:'Информация',schedule:'Расписание'})[button.dataset.action];
  notice(name+' — раздел пока не подключён',3500);
 }
});
$('#panLeft').addEventListener('click',()=>pan.scrollBy({left:-Math.max(250,pan.clientWidth*.68),behavior:reduceMotion?'instant':'smooth'}));
$('#panRight').addEventListener('click',()=>pan.scrollBy({left:Math.max(250,pan.clientWidth*.68),behavior:reduceMotion?'instant':'smooth'}));
$('#fit').addEventListener('click',()=>{magnified=false;layout(960);notice('Вся арена помещается на экране. «Масштаб» — увеличит её.',2600)});
$('#rotate').addEventListener('click',()=>{magnified=!magnified;layout(page==='entry'?530:960)});
window.addEventListener('resize',()=>layout());window.addEventListener('orientationchange',()=>setTimeout(()=>layout(),170));
document.addEventListener('visibilitychange',()=>{$('#app').classList.toggle('paused',document.hidden)});
layout(530);show('entry',530);
})();
</script>
<style>.paused *, .paused *::before, .paused *::after{animation-play-state:paused!important}</style>
</body>
</html>
